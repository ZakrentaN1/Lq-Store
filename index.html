<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquidy – zamówienia</title><style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1d1a2b;--mut:#6b6780;--ac:#7c3aed;--acx:#fff;--bd:#e3dff0;--ok:#16a34a;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#14111f;--card:#1e1a2e;--tx:#f1eefb;--mut:#a39fbb;--ac:#a78bfa;--acx:#14111f;--bd:#322c4a;--ok:#4ade80;--er:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header,main{max-width:900px;margin:auto;padding:16px}
h1{margin:0 0 8px;font-size:1.6rem}
.info{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--mut);font-size:.92rem}
.info b{color:var(--tx)}
input,textarea{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.fl{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fl.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.fl .n{font-weight:600}
.q{display:flex;align-items:center;gap:8px;flex-shrink:0}
.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1.2rem;cursor:pointer}
.q button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.q span{min-width:18px;text-align:center;font-weight:700}
.btn{padding:12px 18px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.cartbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none}
.cartbtn.show{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.box{background:var(--card);border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.box h2{margin:0 0 10px}
.row{display:flex;gap:8px;margin-top:12px}.row .btn{flex:1}
.ci{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.rm{background:none;border:0;color:var(--er);cursor:pointer;font-size:1.1rem}
.ok{color:var(--ok)}.er{color:var(--er)}.mut{color:var(--mut)}
.sum{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.sum div{flex:1;min-width:130px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.sum b{font-size:1.5rem;display:block}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
td,th{padding:9px 12px;border-bottom:1px solid var(--bd);text-align:left}
th{color:var(--mut);font-size:.8rem;text-transform:uppercase}
td.r{text-align:right;font-weight:700}
.ord{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hide{display:none!important}

</style></head>
<body>
<header>
<h1>🧪 Liquidy – zamów swój smak</h1>
<div class="info"><b>50 mg nikotyny/ml</b> · <b>30 ml</b> w buteleczce. Tylko dla osób pełnoletnich (18+). Dodaj smaki plusem, potem otwórz koszyk 🛒 i potwierdź zamówienie.</div>
<input id="search" type="search" placeholder="Szukaj smaku…">
</header>
<main><div class="grid" id="grid"></div></main>

<button class="btn cartbtn" id="cartBtn">🛒 Koszyk (<span id="cCnt">0</span>)</button>

<div class="modal" id="mCart"><div class="box">
<h2>🛒 Twój koszyk</h2>
<div id="cItems"></div>
<p><b>Razem: <span id="cTot">0</span> szt.</b></p>
<input id="name" placeholder="Twoje imię / ksywka (wymagane)" maxlength="40">
<input id="note" placeholder="Uwagi (opcjonalnie)" maxlength="120">
<p id="err" class="er hide"></p>
<div class="row"><button class="btn sec" id="cBack">Wróć do smaków</button><button class="btn" id="cOk">Potwierdzam</button></div>
</div></div>

<div class="modal" id="mDone"><div class="box">
<h2 class="ok">✅ Zamówienie przyjęte!</h2>
<p id="dTxt"></p>
<div id="fb" class="hide"><p>Skopiuj ten kod i wyślij go adminowi:</p><textarea id="code" rows="3" readonly></textarea><div class="row"><button class="btn" id="cp">Kopiuj kod</button></div></div>
<div class="row"><button class="btn sec" id="dClose">Zamknij</button></div>
</div></div>

<script>
// === USTAWIENIA ===
// Wklej tu adres swojej bazy Firebase Realtime Database (bez ukośnika na końcu), np.:
// "https://moje-liquidy-default-rtdb.europe-west1.firebasedatabase.app"
const DB_URL = "";

// Lista smaków
const FLAVORS = [
"Blueberry Raspberry Pomegranate","Blue Razz Lemonade","Grape","Strawberry Ice","Strawberry Raspberry Cherry Ice","Cherry 😋","Spearmint (do boxów 😋)","Kiwi Passion Fruit Guava 😋","Sour Watermelon Gummy","Pina Colada","Strawberry Kiwi","Apple Peach","Double Apple","Watermelon","Cherry Cola 😋","Blueberry","Blueberry Sour Raspberry","Blue Razz Ice","Grape Cherry","Cool Mint (do boxów 😋)","Elf Jack","Pink Lemonade 😭💔","Jasmine Raspberry","Sour Apple","Peach Ice","Strawberry Banana","Blackberry Lemon","Elfbull Ice 😋","Blueberry Rose Mint","Lemon Lime","Apple Pear","Strawberry Snoow","Cola","Cherry Lemon Peach 😋","Strawberry Cherry Lemon","Green Grape Rose","Pineapple Ice","Pink Grapefruit","Pink Lemonade Soda","Raspberry Lychee","Energy Grape","Blackberry Sour Raspberry (CH)","Energy Cherry (CH)","Bail Tripel Shot","Forest Mix","Wild Strawberry Kiwi","Raspberry Ice","Triple Raspberry","Watermelon Lemon","Bail","Blue Raspberry Lemonade","Mint (do boxów 😋)","Blueberry Mint (do boxów 😋)","Basil Mint (do boxów 😋)","Cherry Tea","Pomegranate","Punch","Banana Punch","Peach","Strawberry Kvass","Orange Raspberry","🍒 Wisienka na torcie: MYSTERY ONE"];

// SHA-256 hasła admina (hasło: Liquid-Boss-7391). Żeby zmienić: wygeneruj nowy hash SHA-256 swojego hasła.
const ADMIN_HASH = "7f725ffcaac331e0172cb92298847fd486e51ba7f761ba14aeb4ee8aa30b8a2c";

</script>
<script>
const $=id=>document.getElementById(id);
const cart={};
function render(){
  const q=$('search').value.toLowerCase();$('grid').innerHTML='';
  FLAVORS.forEach((f,i)=>{
    if(q&&!f.toLowerCase().includes(q))return;
    const n=cart[i]||0,d=document.createElement('div');d.className='fl'+(n?' sel':'');
    d.innerHTML='<div class="n"></div><div class="q"></div>';d.firstChild.textContent=f;
    const qq=d.lastChild;
    if(n){const m=document.createElement('button');m.textContent='−';m.onclick=()=>chg(i,-1);qq.append(m);const s=document.createElement('span');s.textContent=n;qq.append(s)}
    const p=document.createElement('button');p.className='p';p.textContent='+';p.onclick=()=>chg(i,1);qq.append(p);
    $('grid').append(d);
  });
  const t=Object.values(cart).reduce((a,b)=>a+b,0);
  $('cCnt').textContent=t;$('cartBtn').classList.toggle('show',t>0);
}
function chg(i,d){cart[i]=Math.max(0,Math.min(20,(cart[i]||0)+d));if(!cart[i])delete cart[i];render();if($('mCart').classList.contains('show'))renderCart()}
function renderCart(){
  const box=$('cItems');box.innerHTML='';let t=0;
  const ids=Object.keys(cart);
  if(!ids.length){box.innerHTML='<p class="mut">Koszyk jest pusty.</p>'}
  ids.forEach(i=>{
    t+=cart[i];
    const r=document.createElement('div');r.className='ci';
    const l=document.createElement('span');l.textContent=FLAVORS[i];
    const q=document.createElement('div');q.className='q';
    const m=document.createElement('button');m.textContent='−';m.onclick=()=>chg(i,-1);
    const s=document.createElement('span');s.textContent=cart[i];
    const p=document.createElement('button');p.className='p';p.textContent='+';p.onclick=()=>chg(i,1);
    const x=document.createElement('button');x.className='rm';x.textContent='🗑';x.onclick=()=>{delete cart[i];render();renderCart()};
    q.append(m,s,p,x);r.append(l,q);box.append(r);
  });
  $('cTot').textContent=t;
  if(!ids.length)$('mCart').classList.remove('show');
}
$('search').oninput=render;
$('cartBtn').onclick=()=>{renderCart();$('mCart').classList.add('show')};
$('cBack').onclick=()=>$('mCart').classList.remove('show');
$('dClose').onclick=()=>$('mDone').classList.remove('show');
$('cOk').onclick=async()=>{
  const name=$('name').value.trim();
  if(!name){$('err').textContent='Wpisz imię lub ksywkę.';$('err').classList.remove('hide');return}
  $('err').classList.add('hide');
  const items={};Object.entries(cart).forEach(([i,n])=>items[FLAVORS[i]]=n);
  const order={name,note:$('note').value.trim(),items,ts:Date.now()};
  let saved=false;
  if(DB_URL){try{const r=await fetch(DB_URL+'/orders.json',{method:'POST',body:JSON.stringify(order)});saved=r.ok}catch(e){}}
  $('mCart').classList.remove('show');
  $('fb').classList.toggle('hide',saved);
  if(!saved)$('code').value='LQ:'+btoa(unescape(encodeURIComponent(JSON.stringify(order))));
  $('dTxt').textContent=saved?'Dzięki, '+name+'! Admin zobaczy Twoje zamówienie.':'Nie udało się zapisać automatycznie – przekaż zamówienie adminowi ręcznie.';
  $('mDone').classList.add('show');
  for(const k in cart)delete cart[k];render();
};
$('cp').onclick=()=>{$('code').select();try{navigator.clipboard.writeText($('code').value)}catch(e){document.execCommand('copy')}$('cp').textContent='Skopiowano ✓'};
render();
</script></body></html>
